services:
  localstack:
    image: localstack/localstack:3.8.1
    container_name: localstack
    ports:
      - "4566:4566"     # LocalStack Gateway (all services)
      - "8080:8080"     # LocalStack Web UI (recommended; older examples used 4571)
    environment:
      - SERVICES=dynamodb,sqs,sns,lambda,apigateway
      - DEBUG=0
      - PERSISTENCE=0
      - DOCKER_HOST=unix:///var/run/docker.sock

      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1

      # API Gateway listen (optional)
      - GATEWAY_LISTEN=0.0.0.0:4566

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      # - "./localstack_data:/tmp/localstack"   # uncomment to persist state across restarts

    networks:
      - localstack

networks:
  localstack:
    driver: bridge
    name: localstack

